openapi: 3.0.3
info:
  title: Api
  version: 1.0.0
tags:
  - name: auth
  - name: admin panel
  - name: profile
  - name: game

paths:

# auth

  /api/v1/auth/signin:
    post:
      tags:
        - auth
      summary: sign in
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok

  /api/v1/auth/check:
    post:
      tags:
        - auth
      summary: check for current session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok

  /api/v1/auth/logout:
    post:
      tags:
        - auth
      summary: logout
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok

# admin panel

  /api/v1/shop/admin/promocodes:
    get:
      tags:
        - admin panel
      summary: get promocodes
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/promocode/add:
    post:
      tags:
        - admin panel
      summary: add new promocode
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/promocode/update:
    post:
      tags:
        - admin panel
      summary: update promocode
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/promocode/delete:
    post:
      tags:
        - admin panel
      summary: delete promocode
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok

  /api/v1/shop/admin/products:
    get:
      tags:
        - admin panel
      summary: get products
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/product/add:
    post:
      tags:
        - admin panel
      summary: add new product
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/product/update:
    post:
      tags:
        - admin panel
      summary: update product
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/product/delete:
    post:
      tags:
        - admin panel
      summary: delete product
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok

  /api/v1/shop/admin/tasks:
    get:
      tags:
        - admin panel
      summary: get tasks
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/task/add:
    post:
      tags:
        - admin panel
      summary: add new task
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/task/update:
    post:
      tags:
        - admin panel
      summary: update task
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok
  /api/v1/shop/admin/task/delete:
    post:
      tags:
        - admin panel
      summary: delete task
      security:
        - cookieAuth: []
      responses:
        '200':
          description: ok

# profile
      
  /api/v1/profile/{uuid}/rating:
    post:
      tags:
        - profile
      summary: update user rating
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: uuid
          schema:
            type: integer
          required: true
          description: user uuid
      requestBody:
        required: true
        content:
          application/form:
            schema:
              $ref: '#/components/schemas/NewScoreRequest'
      responses:
        '200':
          description: ok

# game
  
  /api/v1/game/rating/top:
    get:
      tags:
        - game
      summary: get rating e.g. top-10 / top-20
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
          description: offset n for top-n list
      responses:
        '200':
          description: ok

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token

  schemas:

# auth

# profile

    NewScoreRequest:
      required:
        - score
      properties:
        score:
          type: integer
          example: 100
